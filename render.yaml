# Render (plano Free): API do SLM. Arquivo de referência: nada é criado até alguém importá-lo
# no painel do Render. Os valores marcados com "sync: false" são digitados no painel, nunca aqui.
# Guia: docs/HOSPEDAGEM_GRATUITA.md
services:
  - type: web
    name: slm-api
    runtime: node
    plan: free
    # NODE_ENV=production vale também na instalação; --include=dev mantém o TypeScript do build.
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Supabase (pooler, com SSL).
      - key: DATABASE_URL
        sync: false
      # Endereço do Cloudflare Pages, https.
      - key: FRONTEND_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      # O mesmo valor de BACKEND_PROXY_SECRET no Cloudflare. Ao menos 32 caracteres aleatórios.
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: PASSENGER_DATA_KEY
        sync: false
      - key: PASSWORD_RESET_PEPPER
        sync: false
      - key: INSTITUTIONAL_EMAIL_DOMAINS
        sync: false
      # E-mail (Resend, domínio verificado). Só com elas, a recuperação de senha funciona.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Listas de equipe, opcionais (vírgulas). Vazias: a equipe é avisada só na plataforma.
      - key: EMAIL_INTERNAL_TO_MAINTENANCE
        sync: false
      - key: EMAIL_INTERNAL_TO_FLEET
        sync: false
      - key: EMAIL_INTERNAL_TO_FLIGHTS
        sync: false
      - key: EMAIL_INTERNAL_TO_WAREHOUSE
        sync: false
      - key: EMAIL_INTERNAL_TO_SYSTEM
        sync: false
      # Cópias das mensagens ao solicitante, opcionais (vírgulas). Vazias: sem cópia.
      - key: EMAIL_CC_MAINTENANCE
        sync: false
      - key: EMAIL_CC_FLEET
        sync: false
      - key: EMAIL_CC_FLIGHTS
        sync: false
      - key: EMAIL_CC_WAREHOUSE
        sync: false
      # Cota diária (docs/INTEGRACOES_E_AUTOMACOES.md). EMAIL_DAILY_LIMIT é o limite contratado no
      # Resend, ou menor, e precisa ser conferido no painel do Resend: sem ele, a fila não envia.
      - key: EMAIL_DAILY_LIMIT
        sync: false
      - key: EMAIL_RECOVERY_DAILY_RESERVE
        sync: false
      - key: EMAIL_ADMIN_GROUP_MINUTES
        sync: false
      # Testes reais restritos: só os endereços exatos da lista recebem. Sem a lista, nenhum e-mail real
      # sai, nem a recuperação de senha. Só EMAIL_RECIPIENT_RESTRICTION=off desliga, com autorização.
      - key: EMAIL_RECIPIENT_ALLOWLIST
        sync: false
      - key: EMAIL_RECIPIENT_RESTRICTION
        sync: false
      # NOTIFICATION_EMAILS_ENABLED fica de fora de propósito: liberar os demais e-mails exige
      # autorização expressa e é feito à mão no painel (docs/INTEGRACOES_E_AUTOMACOES.md).
      # O disco do Render Free não é persistente: sem ATTACHMENTS_DIR. Os anexos ficam
      # indisponíveis (503) até ATTACHMENTS_STORAGE=supabase (docs/ARMAZENAMENTO_SUPABASE.md) ou
      # =sharepoint (depois da autorização da TI) ser configurado.
      - key: ATTACHMENTS_STORAGE
        sync: false
      # Somente com ATTACHMENTS_STORAGE=supabase: bucket privado no projeto do Supabase.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
