# Mantém os bancos do Supabase (plano Free) ativos: o Supabase pausa o projeto depois de 7 dias sem
# atividade. O banco de homologação já recebe consultas da API quando ela está acordada; o banco real,
# não, porque nenhuma aplicação está ligada a ele. Este robô faz uma consulta mínima (SELECT 1) por dia.
#
# Fica inerte até existirem os segredos do repositório (Settings → Secrets and variables → Actions →
# Secrets), cada um com o endereço de conexão de um usuário SÓ PARA ISTO, sem acesso às tabelas
# (veja docs/MANTER_SERVICOS_ATIVOS.md):
#   SLM_KEEPALIVE_DB_REAL       banco real
#   SLM_KEEPALIVE_DB_HOMOLOG    banco de homologação (opcional)
# Só agendamentos da branch principal (main) rodam. Uso: cerca de 30 minutos de Actions por mês.
name: Manter os bancos ativos

on:
  schedule:
    # Todo dia às 8h17 de Brasília (11h17 UTC). Minuto "quebrado" para fugir do pico do GitHub.
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REAL_URL: ${{ secrets.SLM_KEEPALIVE_DB_REAL }}
      HOMOLOG_URL: ${{ secrets.SLM_KEEPALIVE_DB_HOMOLOG }}
    steps:
      - name: Banco real
        if: ${{ env.REAL_URL != '' }}
        run: psql "$REAL_URL" --no-psqlrc -v ON_ERROR_STOP=1 -tAc 'SELECT 1' > /dev/null && echo "Banco real respondeu."
        env:
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '30'
      - name: Banco de homologação
        if: ${{ env.HOMOLOG_URL != '' }}
        run: psql "$HOMOLOG_URL" --no-psqlrc -v ON_ERROR_STOP=1 -tAc 'SELECT 1' > /dev/null && echo "Homologação respondeu."
        env:
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '30'
      - name: Nenhum banco configurado
        if: ${{ env.REAL_URL == '' && env.HOMOLOG_URL == '' }}
        run: echo "Sem os segredos SLM_KEEPALIVE_DB_REAL e SLM_KEEPALIVE_DB_HOMOLOG, nada a fazer."
